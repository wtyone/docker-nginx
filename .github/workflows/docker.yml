name: Build and publish Nginx

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to rebuild (blank uses the latest upstream release)'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - docker-compose.yml
      - compose-up.sh
      - .github/workflows/docker.yml
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

env:
  IMAGE: mxflare/nginx
  VERSION_ARG: NGINX_VERSION
  UPSTREAM_PAGE: https://nginx.org/en/download.html

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream: ${{ steps.version.outputs.upstream }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Resolve upstream release
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "$UPSTREAM_PAGE" --output "$RUNNER_TEMP/upstream.html"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          page = (Path(os.environ["RUNNER_TEMP"]) / "upstream.html").read_text()
          section = re.search(r"(?is)stable version\s*</h4>(.*?)<h4\b", page)
          version_pattern = r"\d+\.\d+\.\d+"
          if section is None:
              raise SystemExit("Could not locate the upstream release section")
          release = re.search(
              rf"""/download/nginx-({version_pattern})\.tar\.gz["']""",
              section[1],
          )
          if release is None:
              raise SystemExit("Could not locate the upstream source tarball")

          upstream = release[1]
          version = os.environ.get("REQUESTED_VERSION", "").strip() or upstream
          if re.fullmatch(version_pattern, version) is None:
              raise SystemExit(f"Invalid upstream version: {version!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", f"upstream={upstream}", sep="\n", file=output)
          PY

      - name: Log in to Docker Hub for scheduled checks
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether both tags already point to the published release
        id: check
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$EVENT" == schedule ]] &&
             release=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION") &&
             latest=$(docker buildx imagetools inspect --raw "$IMAGE:latest") &&
             [[ "$release" == "$latest" ]] &&
             jq -e --arg v "$VERSION" '
               .annotations["org.opencontainers.image.version"] == $v and
               ([.manifests[].platform | select(.os == "linux") | .architecture] | sort)
                 == ["amd64", "arm64"]
             ' <<<"$release" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already published $IMAGE:$VERSION"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          build-args: ${{ env.VERSION_ARG }}=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:latest
          provenance: false
          sbom: false
          load: true
          cache-from: type=gha,scope=nginx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nginx-${{ matrix.arch }}

      - name: Test Compose startup, reload, and WebDAV as www-data
        run: |
          data_dir=/opt/nginx
          docker compose config --quiet
          cleanup() {
            docker compose logs
            docker compose down
          }
          trap cleanup EXIT

          ./compose-up.sh --pull never
          test "$(docker compose exec -T nginx id -u)" = "$(id -u www-data)"
          test "$(docker compose exec -T nginx id -g)" = "$(id -g www-data)"
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1/ >/dev/null
          test -s "$data_dir/conf/nginx.conf"
          test -s "$data_dir/logs/access.log"
          docker compose exec -T nginx nginx -V 2>&1 | grep -F "nginx/$VERSION"
          printf '%s\n' 'persistent file' | sudo -u www-data tee "$data_dir/html/compose-check.txt" >/dev/null
          docker compose restart
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1/compose-check.txt | grep -Fx 'persistent file'

          sudo -u www-data tee "$data_dir/conf/compose-reload.conf" >/dev/null <<'NGINX'
          events {}
          http {
              dav_ext_lock_zone zone=compose_dav:1m;
              server {
                  listen 80;
                  root /opt/nginx/html;
                  location /compose-dav/ {
                      dav_methods PUT;
                      create_full_put_path on;
                      dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
                      dav_ext_lock zone=compose_dav;
                  }
                  location = /compose-reload-check { return 200 "reloaded\n"; }
              }
          }
          NGINX
          sudo -u www-data mv "$data_dir/conf/compose-reload.conf" "$data_dir/conf/nginx.conf"
          docker compose exec -T nginx nginx -t
          docker compose exec -T nginx nginx -s reload
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1/compose-reload-check | grep -Fx 'reloaded'

          dav_url=http://127.0.0.1/compose-dav/first/second/check.txt
          dav_curl=(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1)
          "${dav_curl[@]}" --request PUT --data-binary 'nested file' "$dav_url" >/dev/null
          test "$("${dav_curl[@]}" "$dav_url")" = 'nested file'

          "${dav_curl[@]}" --request OPTIONS --dump-header - --output /dev/null "$dav_url" \
            | grep -i '^Allow:.*PROPFIND'
          status=$("${dav_curl[@]}" --request PROPFIND \
            --header 'Depth: 0' --header 'Content-Type: application/xml' \
            --data-binary '<D:propfind xmlns:D="DAV:"><D:allprop/></D:propfind>' \
            --output "$RUNNER_TEMP/dav-properties.xml" --write-out '%{http_code}' "$dav_url")
          test "$status" = 207
          grep -F 'check.txt' "$RUNNER_TEMP/dav-properties.xml"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          build-args: ${{ env.VERSION_ARG }}=${{ env.VERSION }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest for publishing
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
      UPSTREAM: ${{ needs.release.outputs.upstream }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform image
        run: |
          read -r amd64 < "$RUNNER_TEMP/digests/digest-amd64"
          read -r arm64 < "$RUNNER_TEMP/digests/digest-arm64"
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" == "$UPSTREAM" ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"

          manifest=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION")
          jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort)
            == ["amd64", "arm64"]' <<<"$manifest"
          if [[ "$VERSION" == "$UPSTREAM" ]]; then
            [[ "$manifest" == "$(docker buildx imagetools inspect --raw "$IMAGE:latest")" ]]
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION"
