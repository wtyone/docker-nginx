services:
  nginx:
    image: mxflare/nginx:latest
    network_mode: host
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    user: "${WWW_DATA_USER:-0:0}"
    restart: unless-stopped
    volumes:
      - /opt/nginx/conf:/opt/nginx/conf
      - /opt/nginx/logs:/opt/nginx/logs
      - /opt/nginx/html:/opt/nginx/html
